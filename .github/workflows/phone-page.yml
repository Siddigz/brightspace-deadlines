# Publishes the phone sign-in page (phone-public/) to GitHub Pages whenever it changes.
# The page holds no data: it fetches the real dashboard from your private repo.
name: Phone page

on:
  push:
    branches: [main]
    paths: ['phone-public/**', 'scripts/build-phone.mjs', '.github/workflows/phone-page.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:phone
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: phone-dist
      - id: deployment
        uses: actions/deploy-pages@v4
