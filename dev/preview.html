<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Tracker (preview)</title>
  <link rel="stylesheet" href="../dashboard.css">
</head>
<body>
  <!-- Same markup as dashboard.html; chrome.* is faked with sample data. Serve the repo root and open /dev/preview.html. -->
  <header class="top">
    <div class="brand">
      <h1>Course Tracker</h1>
      <p id="sync-status" class="muted">Not synced yet</p>
    </div>
    <button id="sync-btn" class="btn primary">Sync now</button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="deadlines" aria-selected="true">Deadlines</button>
    <button role="tab" data-view="grades" aria-selected="false">Grades</button>
    <button role="tab" data-view="news" aria-selected="false">Announcements</button>
  </nav>
  <div id="course-filter" class="chips"></div>
  <main id="view"></main>

  <script type="module">
    import { fixture } from './fixture.js';
    const data = { snapshot: fixture, prefs: {} };
    const listeners = [];
    globalThis.chrome = {
      storage: {
        local: {
          async get(keys) { return Object.fromEntries(keys.filter((k) => k in data).map((k) => [k, structuredClone(data[k])])); },
          async set(obj) { Object.assign(data, structuredClone(obj)); listeners.forEach((f) => f()); },
        },
        onChanged: { addListener: (f) => listeners.push(f) },
      },
      runtime: { async sendMessage() { data.snapshot = { ...data.snapshot, syncedAt: new Date().toISOString() }; } },
    };
    await import('../src/dashboard.js');
  </script>
</body>
</html>
